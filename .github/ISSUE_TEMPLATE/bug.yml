name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more specific the repro, the faster it gets fixed.

        **If your bug is "Claude Code can't connect to the MCP server on Windows"**, please use the **Windows registration failure** template instead — it has the right diagnostic prompts for that class.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, specific description.
      placeholder: e.g. "After calling search_graph with a regex containing `\\w+`, the server returned a 500 with no error detail."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. "Either a matched-symbols list or a structured 400 with a regex parse error."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimum steps to reproduce. Include the exact `mcp__codebase_graph__*` tool call shape if applicable.
      placeholder: |
        1. Index a project containing 10+ TypeScript files
        2. Call `mcp__codebase_graph__search_graph({ query: '\\w+', limit: 10 })`
        3. Server returns 500
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `npm view @hesnotsoharry/codebase-graph-mcp version` or your installed version.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "v20.18.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (stderr only)
      description: The server logs diagnostics to stderr with `[trace:*]` prefixes. Paste any relevant lines. **Do not paste stdout** — stdout carries the MCP JSON-RPC protocol and is not useful for debugging.
      render: text
